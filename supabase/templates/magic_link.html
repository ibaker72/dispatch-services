<!-- Supabase Auth email template. Paste into Supabase Dashboard → Authentication → Email Templates,
     or reference from supabase/config.toml. Uses token-hash links so sign-in works across browsers. -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:560px;margin:0 auto;padding:24px;color:#0f1f33;background:#faf8f5">
  <h1 style="font-size:20px;margin:0 0 16px">Your sign-in link</h1>
  <p style="font-size:15px;line-height:1.5;margin:0 0 20px">Use the button below to sign in to your account.</p>
  <p style="margin:0 0 24px">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}"
       style="display:inline-block;background:#0f1f33;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;font-weight:bold">Sign in</a>
  </p>
  <p style="font-size:13px;line-height:1.5;color:#4a5a6a;margin:0 0 8px">This link expires soon and can be used once. If you did not request it, you can ignore this email.</p>
  <p style="font-size:13px;line-height:1.5;color:#4a5a6a;margin:0">Plain link: {{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}</p>
</div>
